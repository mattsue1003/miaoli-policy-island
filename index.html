<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>苗栗政策島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="2026 苗栗縣長候選人陳品安、鍾東錦政見對照：兩座政策島，一格一項政策主題。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D lake with two islands; floating brand chip top-left, index panel right (bottom sheet on phones), detail card left. */
:root{
  --ink:#1c2b2f; --ink-2:#4b5d61; --paper:#f4f7f5; --panel:rgba(250,252,250,.94); --line:#d5dfdb;
  --mist:#dfe9e6;
  --chen:#2f8a52; --chen-soft:#e2f1e7; --chung:#2f55a4; --chung-soft:#e3eaf8;
  --gold:#c9902a;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(28,43,47,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e6eeec; --ink-2:#a9bbb7; --paper:#121b1e; --panel:rgba(22,32,35,.94); --line:#2c3c40; --mist:#16232a;
  --chen:#5cc483; --chen-soft:#1d3527; --chung:#7d9ef0; --chung-soft:#1e2944; --gold:#e3b257; color-scheme:dark;
  --shadow:0 10px 30px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --ink:#e6eeec; --ink-2:#a9bbb7; --paper:#121b1e; --panel:rgba(22,32,35,.94); --line:#2c3c40; --mist:#16232a;
  --chen:#5cc483; --chen-soft:#1d3527; --chung:#7d9ef0; --chung-soft:#1e2944; --gold:#e3b257; color-scheme:dark;
  --shadow:0 10px 30px rgba(0,0,0,.4);}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--mist);color:var(--ink);font-family:var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;
  display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:999px;border:0;
  background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;font-weight:500;transition:opacity .2s}
.tag b{font-family:var(--f-mono);font-size:10px;color:#fff;border-radius:999px;padding:1px 6px}
.tag.chen b{background:var(--chen)} .tag.chung b{background:var(--chung)}
.tag.dim{opacity:.25}
.tag .rk{font-style:normal;font-size:10px;color:var(--ink-2);margin-left:4px}
.compact .tag:not(.on) span{display:none} .compact .tag:not(.on){padding:3px 4px} .tag.on{outline:2px solid var(--gold)}
.isle-name{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--f-display);font-weight:700;
  font-size:22px;padding:4px 14px;border-radius:12px;color:#fff;letter-spacing:.06em;box-shadow:var(--shadow)}
.isle-name small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;letter-spacing:0;opacity:.9;text-align:center}
.isle-name.chen{background:var(--chen)} .isle-name.chung{background:var(--chung)}

.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);max-width:min(340px,calc(100vw - 32px))}
.brand .eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.brand h1{font-family:var(--f-display);font-size:28px;margin:2px 0 4px;line-height:1.1;text-wrap:balance}
.brand h1 span{color:var(--gold)}
.brand p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.vs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vs button{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff}
.vs .c1{background:var(--chen)} .vs .c2{background:var(--chung)} .vs .both{background:var(--ink);color:var(--paper)}

.toolbar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(372px + max(16px,env(safe-area-inset-right,0px)));display:flex;gap:6px}
.toolbar button{border:0;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:var(--shadow)}
.toolbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolbar{align-items:center;flex-wrap:wrap;justify-content:flex-end}
.timebar{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.timebar button{box-shadow:none;padding:6px 8px;display:flex;align-items:center;gap:4px;border-radius:9px;background:transparent}
.timebar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.timebar output{font-family:var(--f-mono);font-size:12px;padding:0 8px;font-variant-numeric:tabular-nums}
@media (max-width:1300px){.timebar span{display:none}}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:5px 10px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}

.sidebar{position:absolute;top:0;right:0;bottom:0;width:360px;background:var(--panel);backdrop-filter:blur(8px);
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.side-head{padding:0 18px 10px}
.side-head .eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.side-head h2{font-family:var(--f-display);font-size:24px;margin:4px 0 6px}
.side-head p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;background:var(--mist);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:700}
.tabs button[data-tab="chen"][aria-selected="true"]{color:var(--chen)} .tabs button[data-tab="chung"][aria-selected="true"]{color:var(--chung)}
.tree{flex:1;overflow:auto;padding:4px 10px calc(18px + env(safe-area-inset-bottom,0px));min-height:0}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;
  padding:10px 8px;border-radius:12px;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--mist)}
.row .n{font-family:var(--f-display);font-size:20px;font-style:italic}
.row.chen .n{color:var(--chen)} .row.chung .n{color:var(--chung)}
.row .t{font-size:14.5px;font-weight:500;min-width:0}
.row .t small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:400}
.row .c{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.cmp-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.pip{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:999px;font-family:var(--f-mono);font-size:11px;color:#fff;padding:0 6px}
.pip.chen{background:var(--chen)} .pip.chung{background:var(--chung)} .pip.none{background:transparent;color:var(--ink-2);border:1px dashed var(--line)}
.hit{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px;border-bottom:1px solid var(--line);font-size:13.5px}
.hit:hover{background:var(--mist)} .hit small{display:block;color:var(--ink-2);font-size:11.5px}
.bio{font-size:12.5px;line-height:1.6;color:var(--ink-2);padding:6px 8px 10px;border-bottom:1px solid var(--line)}
.bio ul{margin:4px 0 0;padding-left:18px}
.slogan{display:inline-block;margin:2px 4px 0 0;padding:1px 8px;border-radius:999px;font-size:11.5px}
.issue{padding:12px 8px;border-bottom:1px solid var(--line)}
.issue h4{margin:0 0 4px;font-family:var(--f-display);font-size:17px}
.issue p{margin:0;font-size:13px;line-height:1.65;color:var(--ink-2)}
.issue .src{font-family:var(--f-mono);font-size:10.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.issue .src a{color:var(--ink-2)}
.warn{display:block;margin-top:4px;font-size:11.5px;color:var(--gold)}
.board{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:376px;top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--panel);backdrop-filter:blur(10px);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:6;overflow:hidden}
.board-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.board-head h3{font-family:var(--f-display);font-size:24px;margin:2px 0 0;flex:1;min-width:0;text-wrap:balance}
.board-head .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--gold)}
.board-head .close{border:0;background:transparent;font-size:26px;line-height:1;color:var(--ink-2);padding:2px 6px}
.board-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.seg2{display:inline-flex;background:var(--mist);border-radius:10px;padding:3px;gap:2px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:12.5px}
.seg2 button[aria-pressed="true"]{background:var(--panel);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.board-body{flex:1;overflow:auto;min-height:0;padding:0 18px 22px}
.ctable{width:100%;border-collapse:separate;border-spacing:0;min-width:640px;font-size:13px}
.ctable th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;padding:10px 8px;font-family:var(--f-display);font-size:17px;border-bottom:2px solid var(--line)}
.ctable th.chen{color:var(--chen)} .ctable th.chung{color:var(--chung)}
.ctable td{vertical-align:top;padding:10px 8px;border-bottom:1px solid var(--line)}
.ctable td.cat{font-weight:700;width:120px;font-size:13.5px}
.ctable tr.area th{position:static;background:var(--mist);font-size:15px;padding:8px 10px;border-radius:8px;border-bottom:0}
.ctable tr.both td{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.ctable td.cat small{color:var(--gold)!important;font-family:var(--f-body)!important}
.hidrec{display:block;font-size:11.5px;color:var(--ink-2);padding:4px 6px;border:1px dashed var(--line);border-radius:8px}
.gap{display:block;height:100%;min-height:22px;border-radius:8px;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 7px)}
.ctable td.cat small{display:block;font-weight:400;color:var(--ink-2);font-family:var(--f-mono);font-size:10.5px;margin-top:2px}
.ci{display:flex;gap:6px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:4px 4px;border-radius:8px;line-height:1.45}
.ci:hover{background:var(--mist)}
.ci .tt{flex:1;min-width:0}
.ci .tg{font-size:10px;padding:1px 6px;border-radius:999px;white-space:nowrap;background:var(--mist);color:var(--ink-2)}
.ci .tg.rec{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--ink)}
.dots{display:inline-flex;gap:2px;white-space:nowrap;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-2);display:inline-block;box-sizing:border-box}
.dots i.y{background:var(--ink);border-color:var(--ink)} .dots i.p{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border-color:var(--ink)}
.none{color:var(--ink-2);font-size:12px;font-style:italic}
.chk{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chk span{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chk span.y{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chk span.rec{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink);border-color:transparent}
.prog{margin:6px 0 0;font-size:12px;color:var(--ink-2);line-height:1.55}.prog b{color:var(--ink);margin-right:6px;font-size:11px}.prog a{color:var(--ink-2);font-family:var(--f-mono);font-size:10.5px}
.chk span.p{background:color-mix(in srgb,var(--ink) 18%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.item details{margin-top:6px} .item summary{font-size:11.5px;color:var(--ink-2);cursor:pointer}
.item details ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--ink-2);line-height:1.6}
.legend{font-size:12px;color:var(--ink-2);line-height:1.7;padding:12px 0 0}
.legend b{color:var(--ink)}
.deep{max-width:860px}
.deep h4{font-family:var(--f-display);font-size:18px;margin:18px 0 8px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sides>div{min-width:0;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.65}
.sides .chen{background:var(--chen-soft)} .sides .chung{background:var(--chung-soft)}
.sides b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
.sides .chen b{color:var(--chen)} .sides .chung b{color:var(--chung)}
.math{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.math .sum{padding:10px 12px;font-weight:700;font-size:14.5px;background:var(--mist)}
.math table{width:100%;border-collapse:collapse;font-size:12.5px}
.math td{padding:6px 12px;border-top:1px solid var(--line);vertical-align:top}
.math td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;width:46%}
.math td a{color:var(--ink-2);font-family:var(--f-mono);font-size:10.5px}
.math .f{padding:8px 12px;font-family:var(--f-mono);font-size:12px;border-top:1px solid var(--line);color:var(--ink-2);word-break:break-all}
.deep ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
.deep ul a{color:var(--ink-2);font-family:var(--f-mono);font-size:10.5px;margin-left:4px}
.ask li{margin-bottom:4px}
.issue-btn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:10px}
.issue-btn:hover{background:var(--mist)} .issue-btn b{font-family:var(--f-display);font-size:16.5px;display:block} .issue-btn small{color:var(--ink-2);font-size:12px;line-height:1.5;display:block;margin-top:2px}
.openboard{width:100%;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px;font-weight:700;margin:8px 0 6px}
.note{font-size:11.5px;color:var(--ink-2);line-height:1.6;padding:12px 8px 0}

.card{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(150px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(400px,calc(100vw - 32px));background:var(--panel);backdrop-filter:blur(8px);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.card.wide{top:auto;right:376px;width:auto;height:44%}
.card .close{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:24px;line-height:1;padding:4px 8px;color:var(--ink-2)}
#card-content{overflow:auto;padding:18px 18px 22px;min-height:0}
.card .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em}
.card h3{font-family:var(--f-display);font-size:26px;margin:4px 0 6px;padding-right:28px;text-wrap:balance}
.card .lede{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);margin-right:4px}
.item{padding:11px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);margin-top:8px}
.item h4{margin:0 0 3px;font-size:14.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.item p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.item .src{display:block;margin-top:5px;font-size:11px;font-family:var(--f-mono);color:var(--ink-2);word-break:break-all}
.item .src a{color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.q{margin:7px 0 0;padding:5px 9px;border-left:3px solid var(--line);font-size:12px;color:var(--ink-2);line-height:1.6;background:color-mix(in srgb,var(--mist) 60%,transparent);border-radius:0 8px 8px 0}
.basis{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--mist);color:var(--ink-2)}
.basis.rec{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols>div{min-width:0}
.colhead{font-family:var(--f-display);font-weight:700;font-size:18px;padding:6px 10px;border-radius:10px;color:#fff}
.colhead.chen{background:var(--chen)} .colhead.chung{background:var(--chung)}
.empty{font-size:13px;color:var(--ink-2);padding:12px;border:1px dashed var(--line);border-radius:12px;margin-top:8px;line-height:1.6}
.jump{border:0;background:transparent;color:var(--gold);font-size:12.5px;padding:0;margin-top:10px;text-decoration:underline}

.foot{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));right:380px;
  font-size:11px;color:var(--ink-2);pointer-events:none;background:var(--panel);padding:4px 10px;border-radius:999px;width:fit-content;max-width:calc(100% - 20px)}
.card:not([hidden]) ~ .foot{display:none}
.campad{position:absolute;right:calc(376px + max(16px,env(safe-area-inset-right,0px)));bottom:calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:3}
.cp-views,.cp-grid{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:4px;display:flex;gap:2px}
.cp-grid{display:grid;grid-template-columns:repeat(3,38px);grid-template-areas:"tu zi ." "rl hm rr" "td zo .";gap:3px}
.campad button{display:grid;place-items:center;border:0;background:transparent;border-radius:10px;height:34px;font-size:17px;color:var(--ink);touch-action:manipulation}
.cp-views button{font-size:12.5px;padding:0 10px}
.cp-toggle{display:none!important;background:var(--panel)!important;box-shadow:var(--shadow);padding:0 12px;font-size:13px!important;order:9}
.campad button:hover,.campad button:active{background:var(--mist)}
.campad button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
[data-cam=tiltUp]{grid-area:tu}[data-cam=zoomIn]{grid-area:zi}[data-cam=rotL]{grid-area:rl}[data-cam=home]{grid-area:hm}[data-cam=rotR]{grid-area:rr}[data-cam=tiltDown]{grid-area:td}[data-cam=zoomOut]{grid-area:zo}
.hint{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12.5px;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}
.board:not([hidden]) ~ .campad{display:none}
.card.wide:not([hidden]) ~ .campad{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--mist);font-family:var(--f-display);font-size:22px;transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

/* ---------- baking static meshes into a few draw calls ---------- */
const vcMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:.72});
const KEEP_MATS = new Set([winMat, lampMat, lanternMat, glassMat]);
const isPlain = m => m.isMeshStandardMaterial && m !== vcMat && !KEEP_MATS.has(m) && !m.transparent && !m.map && m.metalness === 0 && m.side !== THREE.DoubleSide && (m.emissiveIntensity === 0 || m.emissive.getHex() === 0);
function bake(root){
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert(), buckets = new Map(), remove = [];
  (function walk(o){ for(const c of [...o.children]){ if(c.userData.dyn || c.userData.keep) continue;
    if(c.isMesh){ let g = c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone();
      for(const k of Object.keys(g.attributes)) if(!['position','normal','uv'].includes(k)) g.deleteAttribute(k);
      if(!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));
      g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, c.matrixWorld)); g.clearGroups();
      let key = c.material;
      if(isPlain(c.material)){ key = vcMat; const n = g.attributes.position.count, col = new Float32Array(n*3), cc = c.material.color;
        for(let i=0;i<n;i++){ col[i*3] = cc.r; col[i*3+1] = cc.g; col[i*3+2] = cc.b; } g.setAttribute('color', new THREE.BufferAttribute(col, 3)); }
      (buckets.get(key) || buckets.set(key, []).get(key)).push(g); remove.push(c); }
    walk(c); } })(root);
  remove.forEach(c => c.parent && c.parent.remove(c));
  for(const [m, arr] of buckets){ const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(arr); if(!merged) continue;
    const ms = new THREE.Mesh(merged, m); ms.castShadow = ms.receiveShadow = true; root.add(ms); }
}

/* ---------- hex terrain ---------- */
const HEX = 2.05;
function axial(q,r){ return [HEX*Math.sqrt(3)*(q + r/2), HEX*1.5*r]; }
function ringCoords(n){
  const out=[[0,0]]; const dirs=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  for(let k=1; out.length<n; k++){ let q=-k, r=k; for(let d=0; d<6; d++) for(let s=0; s<k; s++){ out.push([q,r]); q+=dirs[d][0]; r+=dirs[d][1]; } }
  return out;
}
function hexShape(R, rr){
  const V = []; for(let k=0;k<6;k++){ const a = Math.PI/6 + k*Math.PI/3; V.push(new THREE.Vector2(Math.cos(a)*R, Math.sin(a)*R)); }
  const t = rr/R, P = (i,j) => V[i].clone().lerp(V[j], t), s = new THREE.Shape(), st = P(0,1); s.moveTo(st.x, st.y);
  for(let i=0;i<6;i++){ const n = (i+1)%6, pin = P(n,i), pout = P(n,(i+2)%6); s.lineTo(pin.x,pin.y); s.quadraticCurveTo(V[n].x,V[n].y,pout.x,pout.y); }

const _bx = new THREE.Box3(), _mi = new THREE.Matrix4();

  const pts = [], ringPts = (isl, rr, a0, dir) => { for(let i=0;i<=140;i++){ const a = a0 + dir*i/140*Math.PI*2; pts.push([isl.cx + Math.cos(a)*rr, DECK, Math.sin(a)*rr]); } };
  const span = (xa, xb) => { for(let i=1;i<N;i++){ const k = i/N; const kk = xa < xb ? k : 1-k; pts.push([xa+(xb-xa)*k, by(kk), 0]); } };
  ringPts(A, rA, 0, 1); span(x0, x1); ringPts(B, rB, Math.PI, -1); span(x1, x0); pts.push(pts[0]);
  const fwd = polyPath(laneOffset(pts, .17)), back = polyPath(laneOffset(pts.slice().reverse(), .17));
  const fleet = [
    o => vehicle(scene, Object.assign({col:0x7ed49b, stripe:0xffffff, len:.72, h:.3, cab:.8, cabZ:0}, o)),
    o => vehicle(scene, Object.assign({col:0xffd23f, roofSign:0xffffff}, o)),
    o => vehicle(scene, Object.assign({col:0xf28b7d}, o)),
    o => vehicle(scene, Object.assign({col:0x8fc7ff, len:.7, h:.32, cab:.3, cabZ:.2}, o)),
    o => { const g = new THREE.Group(); g.userData.dyn = true; scooter(g, 0, 0, 0, pick([0xff9aa2,0x8fc7ff,0xffffff], Math.random)); const pr = person(g, 0, -.03, {s:.8, mood:'laugh'}); pr.position.y = .1; scene.add(g);
      movers.push({obj:g, path:o.path, speed:o.speed, t:o.t}); },
    o => vehicle(scene, Object.assign({col:0xffffff, stripe:0xff6b6b}, o)),
  ];
  const SP = .06;
  fleet.forEach((f, i) => { f({path:fwd, speed:SP, t:i/fleet.length*Math.PI*2}); f({path:back, speed:SP*1.05, t:(i+.5)/fleet.length*Math.PI*2}); });
}

/* comparison links: dotted golden arcs */
const linkGroup = new THREE.Group(); linkGroup.visible = false; scene.add(linkGroup);
function buildLinks(){
  const dot = sph(.08,10,8);
  for(const cat of CAT_ORDER){
    const a = tiles.filter(t => t.ci===0 && t.theme.category===cat), b = tiles.filter(t => t.ci===1 && t.theme.category===cat);
    for(const ta of a) for(const tb of b){
      const p0 = ta.world.clone(), p2 = tb.world.clone(), p1 = p0.clone().lerp(p2,.5); p1.y += 7;
      const curve = new THREE.QuadraticBezierCurve3(p0,p1,p2), N = 40;
      const im = new THREE.InstancedMesh(dot, new THREE.MeshBasicMaterial({color:0xffbf3a, transparent:true, opacity:.85}), N);
      for(let i=0;i<N;i++){ _m4.makeTranslation(...curve.getPoint(i/(N-1)).toArray()); im.setMatrixAt(i, _m4); }
      im.userData.cat = cat; im.userData.curve = curve; linkGroup.add(im);
    }
  }
  tickers.push((dt,t) => { if(!linkGroup.visible) return; linkGroup.children.forEach(im => { if(!im.visible) return; const N = im.count;
    for(let i=0;i<N;i++){ const k = i/(N-1), pulse = 1 + .8*Math.max(0, Math.cos((k - (t*.4 % 1))*Math.PI*6)) ** 8; _p.copy(im.userData.curve.getPoint(k)); _s.setScalar(pulse); _m4.compose(_p,_q,_s); im.setMatrixAt(i,_m4); }
    im.instanceMatrix.needsUpdate = true; }); });
}

function fragHref(url, quote){ quote = quote || DATA.quotes?.[url]; if(!url || !quote) return url;
  const enc = encodeURIComponent(quote).replace(/-/g,'%2D').replace(/,/g,'%2C').replace(/&/g,'%26');
  return url + (url.includes('#') ? ':~:text=' : '#:~:text=') + enc; }
function srcLink(url, quote, label){ if(!url) return ''; return `<a href="${esc(fragHref(url, quote))}" target="_blank" rel="noopener" title="開啟原文${quote || DATA.quotes?.[url] ? '並標示引用段落' : ''}">${esc(label || host(url))} ↗</a>`; }

      return `<button class="row cmp" data-cat="${esc(cat)}" style="grid-template-columns:1fr auto auto"><span class="t">${esc(cat)}</span>
        <span class="pip ${a?'chen':'none'}" title="陳品安 ${a} 項">${a||'–'}</span><span class="pip ${b?'chung':'none'}" title="鍾東錦 ${b} 項">${b||'–'}</span></button>`; }).join('')
      + `<p class="note">數字是該領域的<b>新政見</b>細項數（不含現任者的施政紀錄）。「–」表示公開資料中暫未找到。項目多寡只反映已公開內容的多寡，不代表政策優劣。</p>`;
  } else if(tab==='issues'){
    tree.innerHTML = DATA.issues.map((i,k)=>`<button class="issue-btn" data-issue-open="${k}"><b>${esc(i.issue)}</b><small>${esc((DATA.deep?.issues||[]).find(x=>x.issue===i.issue)?.math?.summary || i.summary.slice(0,60)+'…')}</small></button>`).join('')
      + `<p class="note">點一個爭點，看雙方說法、成本試算、卡關點與可以追問的問題。</p>`;
  } else { const ci = tab==='chen'?0:1, c = DATA.candidates[ci], b = c.bio;
    tree.innerHTML = `<div class="bio"><b style="color:var(--${KEYS[ci]})">${esc(c.name)}</b>｜${esc(c.party)}<br>${esc(b.born)}<br>${esc(b.education)}<ul>${b.experience.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${(b.sources||[]).length ? `<div style="margin-top:4px;font-size:11px">資料來源：${b.sources.map(u => srcLink(u)).join('、')}</div>` : ''}
      ${c.slogans?.length? '<div style="margin-top:6px">'+c.slogans.map(x=>`<span class="slogan" style="background:var(--${KEYS[ci]}-soft);color:var(--${KEYS[ci]})">${esc(x)}</span>`).join('')+'</div>':''}</div>` +
      c.themes.map((th,ti)=>`<button class="row ${KEYS[ci]}" data-ci="${ci}" data-ti="${ti}"><span class="n">${String(ti+1).padStart(2,'0')}</span>
      <span class="t">${esc(th.name)}<small>${esc(th.category)}${isRecord(th)?'・已實施／施政紀錄':''}</small></span><span class="c">${th.items.length} ↗</span></button>`).join('')
      + (c.themes.some(th => th.items.some(it => it.chk)) ? `<p class="note">每項政見的「具體度」檢核，點主題後在卡片中查看。</p>` : ''); }
  markRows();
}
function markRows(){ document.querySelectorAll('#tree .row').forEach(r => r.classList.toggle('on',
  (state.mode==='cat' && r.dataset.cat===state.cat) || (state.mode==='theme' && +r.dataset.ci===state.ci && +r.dataset.ti===state.ti))); }
$('#tree').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.board){ openBoard('table'); return; } if(b.dataset.issueOpen != null){ openBoard('issue', +b.dataset.issueOpen); return; }
  if(b.dataset.cat) selectCat(b.dataset.cat); else selectTheme(+b.dataset.ci, +b.dataset.ti);
  if(isPhone()) $('#sidebar').classList.add('min'); });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', x===b)); $('#search').value=''; renderTree();
  if(tab!=='cmp') flyIsland(tab==='chen'?0:1); });
$('#search').addEventListener('input', renderTree);
$('#sheet-handle').onclick = () => $('#sidebar').classList.toggle('min');
document.querySelectorAll('[data-fly]').forEach(b => b.onclick = () => { b.dataset.fly==='all' ? overview() : flyIsland(+b.dataset.fly); });
/* camera pad */
function camState(){ const o = camera.position.clone().sub(controls.target), d = o.length(); return {d, polar:Math.acos(Math.min(1, o.y/d)), az:Math.atan2(o.x, o.z)}; }
function camTo(d, polar, az, tgt){ polar = Math.min(controls.maxPolarAngle, Math.max(controls.minPolarAngle, polar)); d = Math.min(controls.maxDistance, Math.max(controls.minDistance, d));
  flyTo((tgt || controls.target).clone(), d, polar, az, .55); }
const CAM = {
  zoomIn: s => camTo(s.d*.72, s.polar, s.az), zoomOut: s => camTo(s.d/.72, s.polar, s.az),
  rotL: s => camTo(s.d, s.polar, s.az - Math.PI/6), rotR: s => camTo(s.d, s.polar, s.az + Math.PI/6),
  tiltUp: s => camTo(s.d, s.polar - .22, s.az), tiltDown: s => camTo(s.d, s.polar + .22, s.az),
  home: () => overview(),
};
const VIEWS = {top:.14, mid:.9, low:1.25};
document.getElementById('campad').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; const s = camState();
  if(b.dataset.cam) CAM[b.dataset.cam](s);
  if(b.dataset.view){ camTo(b.dataset.view === 'low' ? Math.min(s.d, 40) : s.d, VIEWS[b.dataset.view], s.az); document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b)); } });
controls.addEventListener('start', () => { flight = null; hideHint(); });
$('#cp-toggle').onclick = e => { e.stopPropagation(); const o = $('#campad').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); e.currentTarget.textContent = o ? '收合 ⌃' : '視角 ⌄'; };
const hintEl = $('#hint'); hintEl.textContent = matchMedia('(pointer: coarse)').matches ? '單指拖曳移動地圖・雙指縮放與旋轉' : '按住拖曳移動地圖・滾輪縮放・右鍵拖曳旋轉';
function hideHint(){ hintEl.classList.add('off'); } setTimeout(hideHint, 7000);
addEventListener('keydown', e => { if(e.target.closest('input,textarea') || !$('#board').hidden) return; const s = camState();
  const k = {'+':'zoomIn','=':'zoomIn','-':'zoomOut','q':'rotL','e':'rotR','r':'tiltUp','f':'tiltDown'}[e.key]; if(k) CAM[k](s); });
let paused = reduce;
$('#t-pause').setAttribute('aria-pressed', paused);
$('#t-pause').onclick = e => { paused = !paused; e.currentTarget.setAttribute('aria-pressed', paused); };
$('#t-links').onclick = e => { linkGroup.visible = !linkGroup.visible; e.currentTarget.setAttribute('aria-pressed', linkGroup.visible); };

/* picking + hover */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null, hovered = null;
const tip = $('#tip');
function hitAt(e){ const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ptr, camera);
  return ray.intersectObjects([...tiles.flatMap(t => t.hits), ...specialHits], false)[0]?.object || null; }
function showTip(e, name){ if(!name){ tip.hidden = true; return; } tip.textContent = '苗栗特產・' + name; tip.hidden = false;
  const r = stage.getBoundingClientRect(); tip.style.transform = `translate(${e.clientX - r.left + 12}px, ${e.clientY - r.top - 34}px)`; }
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointermove', e => { if(e.pointerType !== 'mouse') return; const o = hitAt(e);
  hovered = o?.userData.tile || null; showTip(e, o?.userData.special); renderer.domElement.style.cursor = (hovered || o?.userData.special) ? 'pointer' : ''; });
renderer.domElement.addEventListener('pointerleave', () => { hovered = null; tip.hidden = true; });
let tipTimer;
renderer.domElement.addEventListener('pointerup', e => {
  if(!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  const o = hitAt(e); if(o?.userData.tile) selectTheme(o.userData.tile.ci, o.userData.tile.ti);
  else if(o?.userData.special){ showTip(e, o.userData.special); clearTimeout(tipTimer); tipTimer = setTimeout(() => tip.hidden = true, 2200); }
});

/* 24-hour clock: one Miaoli day every three minutes */
const now = new Date(); let tod = now.getHours() + now.getMinutes()/60, todJump = null;
const clockEl = $('#clock');
function setClock(){ const h = Math.floor(tod) % 24, m = Math.floor((tod % 1)*60); clockEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.querySelectorAll('[data-h]').forEach(b => { const d = ((tod - +b.dataset.h) % 24 + 24) % 24; b.setAttribute('aria-pressed', d < 3); }); }
document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { const to = +b.dataset.h; let d = ((to - tod) % 24 + 24) % 24; todJump = {from:tod, d, t:0}; });

function resize(){ const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

/* keep the scene centred in the part of the screen no panel covers */
const vOff = {x:0, y:0};
function updateViewOffset(dt){
  const W = stage.clientWidth, H = stage.clientHeight; let l = 0, r = W, t = 0, b = H;
  const sb = $('#sidebar').getBoundingClientRect(); if(sb.left > W/2) r = sb.left; else { b = Math.min(b, sb.top, $('.toolbar').getBoundingClientRect().top); t = $('.brand').getBoundingClientRect().bottom; }
  const cd = $('#card'); if(!cd.hidden){ const c = cd.getBoundingClientRect(); if(c.width > W*.55) b = Math.min(b, c.top); else l = Math.max(l, c.right); }
  const tx = (l + r)/2 - W/2, ty = (t + b)/2 - H/2, k = Math.min(1, dt*6);
  vOff.x += (tx - vOff.x)*k; vOff.y += (ty - vOff.y)*k;
  camera.setViewOffset(W, H, -vOff.x, -vOff.y, W, H);
}
/* ---------- loop ---------- */
const clock = new THREE.Clock(); let time = 0, clockTick = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if(todJump){ todJump.t = Math.min(1, todJump.t + dt/1.4); const k = 1 - Math.pow(1 - todJump.t, 3); tod = (todJump.from + todJump.d*k) % 24; if(todJump.t >= 1) todJump = null; }
  else if(!paused) tod = (tod + dt*24/180) % 24;
  applyTime(tod); if((clockTick += dt) > .25){ clockTick = 0; setClock(); }
  if(!paused){ time += dt;
    tickers.forEach(f => f(dt, time));
    movers.forEach(m => { m.t += dt*m.speed; const P = m.path(m.t), [x,z] = P, [x2,z2] = m.path(m.t + .02*Math.sign(m.speed||1));
      m.obj.position.x = x; m.obj.position.z = z; const obs = m.avoid && (m.obsAt ? m.obsAt(m.obj.position) : m.obj.parent?.userData.obs); if(obs) pushOut(m.obj.position, obs, m.avoid); if(!m.noRot && Math.hypot(x2-x, z2-z) < .5) m.obj.rotation.y = Math.atan2(x2-x, z2-z);
      m.obj.position.y = (P[2] ?? m.y ?? 0) + (m.liftAt ? m.liftAt(m.obj.position) : 0) + (m.hop ? Math.abs(Math.sin(time*m.hop + m.t))*.035 : 0) + (m.bob ? Math.sin(time*1.6 + m.t*3)*.05 : 0);
      if(m.bob) m.obj.rotation.z = Math.sin(time*1.3 + m.t)*.06;
      const arms = m.obj.userData.arms; if(arms){ const sw = Math.sin(time*9 + m.t*3)*.55; arms[0].rotation.x = sw; if(!arms[1].userData.hold) arms[1].rotation.x = -sw; } });
  }
  for(const t of tiles){
    const tgt = (t.target||0) + (t === hovered && !t.target ? .14 : 0);
    t.v += (tgt - t.lift) * 140 * dt; t.v *= Math.max(0, 1 - 9*dt); t.lift += t.v * dt;
    t.grp.position.y = .1 + t.lift;
    if(t.spark.visible = (t.target||0) > 0){ t.spark.rotation.y += dt*1.2; t.spark.position.y = t.props.position.y + 2.2 + Math.sin(time*2)*.1; }
  }
  if(paused) movers.forEach(m => { if(m.liftAt){ const P = m.path(m.t); m.obj.position.y = (P[2] ?? 0) + m.liftAt(m.obj.position); } });
  if(flight){ flight.t += dt/flight.dur; const k = flight.t>=1 ? 1 : 1-Math.pow(1-flight.t,3);
    camera.position.lerpVectors(flight.p0, flight.p1, k); controls.target.lerpVectors(flight.c0, flight.c1, k); if(flight.t>=1) flight=null; }
  updateViewOffset(dt); controls.update();
  { const lim = (islands[1].cx + islands[1].R + 4), tg = controls.target, nx = Math.max(-lim, Math.min(lim, tg.x)), nz = Math.max(-24, Math.min(24, tg.z)), dx = nx - tg.x, dz = nz - tg.z;
    if(dx || dz){ tg.x = nx; tg.z = nz; camera.position.x += dx; camera.position.z += dz; } tg.y = 0; } renderer.render(scene, camera); placeLabels();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
const plans = [planIsland(0), planIsland(1)];
buildIsland(0, plans[0], -(plans[0].R + 3.4)); buildIsland(1, plans[1], plans[1].R + 3.4); buildRoads();
const SPAN = (islands[1].cx - islands[0].cx)/26; buildLinks(); buildLabels();
islands.forEach((isl, ci) => { for(let i=0;i<8;i++) butterfly([0xffd36e,0xff9aa2,0xffffff,0x8fc7ff,0xffa94d][i%5], isl.cx, 0, isl.R*.55, 1.6+i%3*.4, i*1.7+ci); });
for(let i=0;i<4;i++) egret(i*1.6, 20 + i*3, 7 + i*.8);
const total = ci => DATA.candidates[ci].themes.reduce((s,t)=>s+t.items.length,0);
const newN = ci => DATA.candidates[ci].themes.reduce((s,t)=>s+t.items.filter(it=>!isRecItem(it)).length,0), recN = ci => total(ci) - newN(ci);
$('#side-sum').innerHTML = `陳品安 新政見 ${newN(0)} 項${recN(0)?`＋施政紀錄 ${recN(0)} 項`:''}<br>鍾東錦 新政見 ${newN(1)} 項${recN(1)?`＋施政紀錄 ${recN(1)} 項`:''}`;
$('#foot').textContent = DATA.footnote;
applyTime(tod); setClock(); resize();
camera.position.set(0, 70, 90); controls.target.set(0,0,0); overview();
renderTree(); frame();
requestAnimationFrame(()=>requestAnimationFrame(()=>$('#loading')?.classList.add('done')));
</script>
