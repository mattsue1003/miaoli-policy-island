.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);margin-right:4px}
.item{padding:11px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);margin-top:8px}
.item h4{margin:0 0 3px;font-size:14.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.item p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.item .src{display:block;margin-top:5px;font-size:11px;font-family:var(--f-mono);color:var(--ink-2);word-break:break-all}
.item .src a{color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.q{margin:7px 0 0;padding:5px 9px;border-left:3px solid var(--line);font-size:12px;color:var(--ink-2);line-height:1.6;background:color-mix(in srgb,var(--mist) 60%,transparent);border-radius:0 8px 8px 0}
.basis{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--mist);color:var(--ink-2)}
.basis.rec{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols>div{min-width:0}
.colhead{font-family:var(--f-display);font-weight:700;font-size:18px;padding:6px 10px;border-radius:10px;color:#fff}
.colhead.chen{background:var(--chen)} .colhead.chung{background:var(--chung)}
.empty{font-size:13px;color:var(--ink-2);padding:12px;border:1px dashed var(--line);border-radius:12px;margin-top:8px;line-height:1.6}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;margin:0 0 10px}
.backbtn:hover{opacity:.88}
.jump{border:0;background:transparent;color:var(--gold);font-size:12.5px;padding:0;margin-top:10px;text-decoration:underline}

.foot{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));right:380px;
  font-size:11px;color:var(--ink-2);pointer-events:none;background:var(--panel);padding:4px 10px;border-radius:999px;width:fit-content;max-width:calc(100% - 20px)}
.card:not([hidden]) ~ .foot{display:none}
.campad{position:absolute;right:calc(376px + max(16px,env(safe-area-inset-right,0px)));bottom:calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:3}
.cp-views,.cp-grid{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:4px;display:flex;gap:2px}
.cp-grid{display:grid;grid-template-columns:repeat(3,38px);grid-template-areas:"tu zi ." "rl hm rr" "td zo .";gap:3px}
.campad button{display:grid;place-items:center;border:0;background:transparent;border-radius:10px;height:34px;font-size:17px;color:var(--ink);touch-action:manipulation}
.cp-views button{font-size:12.5px;padding:0 10px}
.cp-toggle{display:none!important;background:var(--panel)!important;box-shadow:var(--shadow);padding:0 12px;font-size:13px!important;order:9}
.campad button:hover,.campad button:active{background:var(--mist)}
.campad button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
[data-cam=tiltUp]{grid-area:tu}[data-cam=zoomIn]{grid-area:zi}[data-cam=rotL]{grid-area:rl}[data-cam=home]{grid-area:hm}[data-cam=rotR]{grid-area:rr}[data-cam=tiltDown]{grid-area:td}[data-cam=zoomOut]{grid-area:zo}
.hint{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12.5px;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}
.board:not([hidden]) ~ .campad{display:none}
.card.wide:not([hidden]) ~ .campad{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--mist);font-family:var(--f-display);font-size:22px;transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
.sheet-handle{display:none}

@media (max-width:860px){
  .sidebar{top:auto;left:0;width:auto;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding-top:6px;padding-left:max(0px,env(safe-area-inset-left,0px));transition:height .3s}
  .sidebar.min{height:120px}
  .sheet-handle{display:block;margin:0 auto 4px;border:0;background:transparent;padding:6px 30px}
  .sheet-handle i{display:block;width:42px;height:5px;border-radius:9px;background:var(--line)}
  .side-head h2,.side-head p{display:none}
  .toolbar{right:max(16px,env(safe-area-inset-right,0px));left:max(16px,env(safe-area-inset-left,0px));top:auto;bottom:calc(46% + 10px)}
  .timebar span{display:none}
  .campad{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(46% + 62px)}
  .cp-grid{grid-template-columns:repeat(3,34px)} .campad button{height:32px}
  .card:not([hidden]) ~ .campad{display:none}
  .cp-toggle{display:grid!important}
  .campad:not(.open) .cp-views,.campad:not(.open) .cp-grid{display:none}
  .hint{top:calc(118px + env(safe-area-inset-top,0px));font-size:12px}
  .card,.card.wide{top:auto;bottom:0;left:0;width:100%;height:62%;border-radius:20px 20px 0 0;z-index:5;
    padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
  .cols{grid-template-columns:1fr}
  .board{left:0;right:0;top:0;bottom:0;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .board-head,.board-tools,.board-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sides{grid-template-columns:1fr}
  .sc-head{grid-template-columns:1fr}
  .foot{display:none}
  .brand{padding:10px 12px} .brand h1{font-size:22px} .brand p{display:none}
  .isle-name{font-size:16px}
}

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
const DATA = /*DATA*/null;
const KEYS = ['chen','chung'];
const CAT_ORDER = /*CATS*/[];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed){ let s = seed>>>0 || 1; return () => (s = (s*1664525+1013904223)>>>0) / 4294967296; }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }

/* ---------- three scene ---------- */
THREE.ColorManagement.legacyMode = false;
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth <= 860 ? 1.5 : 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.5, 900);
const controls = new THREE.MapControls(camera, renderer.domElement); // drag = pan the map; right-drag / two fingers = rotate & zoom
controls.enableDamping = true; controls.dampingFactor = .08; controls.screenSpacePanning = false;
controls.maxPolarAngle = 1.3; controls.minPolarAngle = .12; controls.minDistance = 3.5; controls.maxDistance = 150; controls.zoomSpeed = .9; controls.panSpeed = 1.1;

const hemi = new THREE.HemisphereLight(0xfff6e8, 0x9cc7a0, .75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d6, 1.45);
sun.castShadow = true; sun.shadow.mapSize.setScalar(innerWidth <= 860 ? 1024 : 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, {left:-44,right:44,top:28,bottom:-28,near:1,far:170});
scene.add(sun, sun.target);

/* materials + shared geometry */
const M = {};
function mat(hex, o={}){ const k = hex+'|'+JSON.stringify(o); return M[k] || (M[k] = new THREE.MeshStandardMaterial(Object.assign({color:hex, roughness:.72, metalness:0}, o))); }
const winMat = new THREE.MeshStandardMaterial({color:0xbfe6f5, roughness:.2, emissive:0xffcf73, emissiveIntensity:0});
const lampMat = new THREE.MeshStandardMaterial({color:0xfff2b8, emissive:0xffd36b, emissiveIntensity:.3});
const lanternMat = new THREE.MeshStandardMaterial({color:0xffa94d, emissive:0xff8a2a, emissiveIntensity:.15, roughness:.5});
const G = {}; const geo = (k, fn) => G[k] || (G[k] = fn());
function mesh(g, m, x=0,y=0,z=0){ const o = new THREE.Mesh(g, typeof m === 'number' ? mat(m) : m); o.position.set(x,y,z); o.castShadow = o.receiveShadow = true; return o; }
const sph = (r,ws=16,hs=12) => geo(`s${r},${ws}`, () => new THREE.SphereGeometry(r,ws,hs));
const cyl = (rt,rb,h,s=16) => geo(`c${rt},${rb},${h},${s}`, () => new THREE.CylinderGeometry(rt,rb,h,s));
const cone = (r,h,s=16) => geo(`k${r},${h},${s}`, () => new THREE.ConeGeometry(r,h,s));
const rbox = (w,h,d,r=.06) => geo(`b${w},${h},${d},${r}`, () => new THREE.RoundedBoxGeometry(w,h,d,3,Math.min(r, w/2-.002, h/2-.002, d/2-.002)));
const capsule = (r,l) => geo(`p${r},${l}`, () => new THREE.CapsuleGeometry(r,l,4,12));
const torus = (r,t,arc=Math.PI*2) => geo(`t${r},${t},${arc}`, () => new THREE.TorusGeometry(r,t,8,20,arc));
const prism = (w,h,len) => geo(`r${w},${h},${len}`, () => { const s = new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(0,h); s.lineTo(-w/2,0);
  const g = new THREE.ExtrudeGeometry(s, {depth:len, bevelEnabled:true, bevelThickness:.03, bevelSize:.03, bevelSegments:2}); g.translate(0,0,-len/2); return g; });
const heart = () => geo('heart', () => { const s = new THREE.Shape(), k = .006;
  s.moveTo(25*k,25*k); s.bezierCurveTo(25*k,25*k,20*k,0,0,0); s.bezierCurveTo(-30*k,0,-30*k,35*k,-30*k,35*k); s.bezierCurveTo(-30*k,55*k,-10*k,77*k,25*k,95*k);
  s.bezierCurveTo(60*k,77*k,80*k,55*k,80*k,35*k); s.bezierCurveTo(80*k,35*k,80*k,0,50*k,0); s.bezierCurveTo(35*k,0,25*k,25*k,25*k,25*k);
  const g = new THREE.ExtrudeGeometry(s, {depth:.06, bevelEnabled:true, bevelThickness:.03, bevelSize:.03, bevelSegments:3}); g.translate(-25*k,-50*k,-.03); g.rotateZ(Math.PI); return g; });
const disc = (r) => geo(`d${r}`, () => { const c = new THREE.CircleGeometry(r, 32); c.rotateX(-Math.PI/2); return c; });

const PAL = {
  grass:0x8fd468, grassFill:0x9fdb74, dirt:0xd4935f, sand:0xf2d79c,
  tree:[0x5fc062,0x4fb06a,0x7ccf6a,0x46a565], wall:[0xfff5e4,0xfde8d4,0xf3f0ff,0xe8f6ee],
  roof:[0xf28b7d,0x7fb3e8,0xf7cf62,0x8fd8b9,0xbaa4e6], skin:0xffd9bd, hair:[0x3b2f2a,0x5a3d2b,0x222222,0x8a5a3a],
  shirt:[0xff9aa2,0x8fc7ff,0xffd36e,0x9de0b8,0xc7a8ff,0xffb36b],
  ribbon:[0x5cc483,0x6f93e8], brick:0xd8805a, gold:0xffcf4d, wood:0xb98257, water:0x6fd0e0,
};
const put = (parent, m) => (parent.add(m), m);
const pick = (arr, r) => arr[Math.floor(r()*arr.length)];
const movers = [], tickers = [];

/* ---------- small cute builders ---------- */
function puffTree(g, x, z, s=1, col){
  const t = new THREE.Group(); t.position.set(x,0,z); t.scale.setScalar(s);
  const c = col ?? PAL.tree[Math.abs(Math.round(x*13+z*7)) % 4];
  t.add(mesh(cyl(.06,.09,.42,10), 0xa8714a, 0,.21,0));
  t.add(mesh(sph(.34), c, 0,.66,0)); t.add(mesh(sph(.24), c, .18,.52,.1)); t.add(mesh(sph(.22), c, -.16,.55,-.09));
  g.add(t); return t;
}
function dotted(t, n, col, r=.05, seed=5, rad=.34, cy=.66){ const rr = rng(seed);
  for(let i=0;i<n;i++){ const v = new THREE.Vector3(rr()-.5, rr()*.9+.1, rr()-.5).normalize().multiplyScalar(rad); t.add(mesh(sph(r,8,6), col, v.x, cy+v.y, v.z)); } }
function tungTree(g, x, z, s=1){ const t = puffTree(g, x, z, s, 0x86c97a); dotted(t, 11, 0xfffbf2, .05, Math.abs(Math.round(x*1000+z*37))+5); return t; }
function pine(g, x, z, s=1){
  const t = new THREE.Group(); t.position.set(x,0,z); t.scale.setScalar(s);
  t.add(mesh(cyl(.05,.07,.3,8), 0xa8714a, 0,.15,0));
  [[.34,.45,.42],[.27,.4,.68],[.18,.34,.92]].forEach(([r,h,y]) => t.add(mesh(cone(r,h,12), 0x5fae78, 0,y,0)));
  g.add(t); return t;
}
function flower(g, x, z, col){ g.add(mesh(cyl(.012,.012,.14,5), 0x6cbf5f, x,.07,z)); g.add(mesh(sph(.045,8,6), col, x,.15,z)); }
function tuft(g, x, z){ for(let i=0;i<3;i++) g.add(mesh(cone(.035,.16,5), 0x86cf66, x+(i-1)*.04, .08, z+(i%2)*.03)); }
function rock(g, x, z, s=1, col=0xd3cdc3){ const m = mesh(geo('rock', () => new THREE.DodecahedronGeometry(.16,0)), col, x,.06*s,z); m.scale.set(s, s*.6, s); g.add(m); return m; }
function windowsOn(g, x, y0, z, w, h, d, rows, cols){
  for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
    const wx = x - w/2 + (j+.5)*w/cols, wy = y0 + (i+.6)*h/(rows+.4);
    g.add(mesh(rbox(w/cols*.55, h/(rows+.4)*.5, .03, .015), winMat, wx, wy, z + d/2 + .005));

/* ---------- baking static meshes into a few draw calls ---------- */
const vcMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:.72});
const KEEP_MATS = new Set([winMat, lampMat, lanternMat, glassMat]);
const isPlain = m => m.isMeshStandardMaterial && m !== vcMat && !KEEP_MATS.has(m) && !m.transparent && !m.map && m.metalness === 0 && m.side !== THREE.DoubleSide && (m.emissiveIntensity === 0 || m.emissive.getHex() === 0);
function bake(root){
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert(), buckets = new Map(), remove = [];
  (function walk(o){ for(const c of [...o.children]){ if(c.userData.dyn || c.userData.keep) continue;
    if(c.isMesh){ let g = c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone();
      for(const k of Object.keys(g.attributes)) if(!['position','normal','uv'].includes(k)) g.deleteAttribute(k);
      if(!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));
      g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, c.matrixWorld)); g.clearGroups();
      let key = c.material;
      if(isPlain(c.material)){ key = vcMat; const n = g.attributes.position.count, col = new Float32Array(n*3), cc = c.material.color;
        for(let i=0;i<n;i++){ col[i*3] = cc.r; col[i*3+1] = cc.g; col[i*3+2] = cc.b; } g.setAttribute('color', new THREE.BufferAttribute(col, 3)); }
      (buckets.get(key) || buckets.set(key, []).get(key)).push(g); remove.push(c); }
    walk(c); } })(root);
  remove.forEach(c => c.parent && c.parent.remove(c));
  for(const [m, arr] of buckets){ const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(arr); if(!merged) continue;
    const ms = new THREE.Mesh(merged, m); ms.castShadow = ms.receiveShadow = true; root.add(ms); }
}

/* ---------- hex terrain ---------- */
const HEX = 2.05;
function axial(q,r){ return [HEX*Math.sqrt(3)*(q + r/2), HEX*1.5*r]; }
function ringCoords(n){
  const out=[[0,0]]; const dirs=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  for(let k=1; out.length<n; k++){ let q=-k, r=k; for(let d=0; d<6; d++) for(let s=0; s<k; s++){ out.push([q,r]); q+=dirs[d][0]; r+=dirs[d][1]; } }
  return out;
}
function hexShape(R, rr){
  const V = []; for(let k=0;k<6;k++){ const a = Math.PI/6 + k*Math.PI/3; V.push(new THREE.Vector2(Math.cos(a)*R, Math.sin(a)*R)); }
  const t = rr/R, P = (i,j) => V[i].clone().lerp(V[j], t), s = new THREE.Shape(), st = P(0,1); s.moveTo(st.x, st.y);
  for(let i=0;i<6;i++){ const n = (i+1)%6, pin = P(n,i), pout = P(n,(i+2)%6); s.lineTo(pin.x,pin.y); s.quadraticCurveTo(V[n].x,V[n].y,pout.x,pout.y); }
  return s;
}
function slab(R, h, b=.12){ return geo(`h${R},${h},${b}`, () => { const g = new THREE.ExtrudeGeometry(hexShape(R-b, .5), {depth:h, bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:3, curveSegments:6});
  g.rotateX(-Math.PI/2); g.translate(0,b,0); return g; }); }
const foamMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.75, depthWrite:false});
function tileBody(grp, h, ribbon, grass){
  const parts = [mesh(slab(HEX-.2, h, .12), PAL.dirt, 0,0,0)];
  if(ribbon != null) parts.push(mesh(slab(HEX-.03, .05, .05), ribbon, 0,h-.05,0));
  parts.push(mesh(slab(HEX-.06, .1, .1), grass, 0,h+.06,0));
  parts.forEach(p => grp.add(p)); return {parts, top:h+.36};
}
function scatter(g, r, n, rmin, rmax, fn){ for(let i=0;i<n;i++){ const a = r()*Math.PI*2, d = rmin + r()*(rmax-rmin); fn(Math.cos(a)*d, Math.sin(a)*d, i); } }

/* plan cells first so the islands and boat lanes can be spaced from the real coastline */
function planIsland(ci){
  const n = DATA.candidates[ci].themes.length, coords = ringCoords(Math.max(n,7)), r = rng(ci*99+3);
  const used = new Set(coords.slice(0,n).map(c => c.join(','))), fillers = [];
  for(const [q,rr] of coords.slice(0,n)) for(const [dq,dr] of [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]]){
    const k = (q+dq)+','+(rr+dr); if(!used.has(k) && r() < .6){ used.add(k); fillers.push([q+dq, rr+dr]); } }
  const cells = [...coords.slice(0,n), ...fillers].map(c => axial(...c));
  const R = Math.max(...cells.map(([x,z]) => Math.hypot(x,z))) + HEX + .4;
  return {coords, fillers, cells, R, r};
}

/* ---------- paths that tie the hexagons together ---------- */
const AXN = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function stoneRing(grp, r=1.45){
  const obs = grp.userData.obs || [], n = Math.round(r*Math.PI*2/.27);
  for(let i=0;i<n;i++){ const a = i/n*Math.PI*2, x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(obs.some(([x0,x1,z0,z1]) => x > x0-.08 && x < x1+.08 && z > z0-.08 && z < z1+.08)) continue;
    const s = mesh(cyl(.085,.095,.03,9), i%3 ? 0xe9e1d2 : 0xd8cfbf, x,.016,z); s.rotation.y = a; s.scale.z = .8; grp.add(s); }
}
function footBridge(g, ax, ay, az, bx, by, bz){
  const dx = bx-ax, dz = bz-az, L = Math.hypot(dx,dz), dy = by-ay, yaw = -Math.atan2(dz,dx), br = new THREE.Group();
  br.position.set((ax+bx)/2, (ay+by)/2, (az+bz)/2); br.rotation.y = yaw; g.add(br);
  if(Math.abs(dy) < .16){ const pitch = Math.atan2(dy, L), len = Math.hypot(L, dy);
    const deck = new THREE.Group(); deck.rotation.z = pitch; br.add(deck);
    deck.add(mesh(rbox(len, .05, .4, .02), 0xc98a5a, 0,.02,0)); for(let i=0;i<5;i++) deck.add(mesh(rbox(.025,.052,.4,.008), 0x9a6a45, -len/2+.1+i*(len-.2)/4,.024,0));
    for(const s of [-1,1]){ deck.add(mesh(rbox(len, .025, .025, .01), 0xf28b7d, 0,.17,s*.19)); for(const k of [-1,0,1]) deck.add(mesh(cyl(.012,.012,.15,5), 0xffffff, k*len*.42,.1,s*.19)); } }
  else { const n = Math.max(3, Math.round(Math.abs(dy)/.09)); for(let i=0;i<n;i++){ const k = (i+.5)/n; br.add(mesh(rbox(L/n+.02, .07, .42, .02), 0xd8cfbf, -L/2+k*L, -dy/2 + dy*k - .02, 0)); }
    for(const s of [-1,1]){ const rl = mesh(rbox(Math.hypot(L,dy), .025, .025, .01), 0xf28b7d, 0,.16,s*.2); rl.rotation.z = Math.atan2(dy, L); br.add(rl); } }
}
function linkHexes(g, net){ // net: [{q,r,x,z,y,grp}]
  const idx = new Map(net.map((c,i) => [c.q+','+c.r, i])), adj = net.map(() => []);
  net.forEach((c,i) => AXN.forEach(([dq,dr]) => { const j = idx.get((c.q+dq)+','+(c.r+dr)); if(j != null){ adj[i].push(j);
    if(j > i){ const o = net[j], ux = (o.x-c.x), uz = (o.z-c.z), l = Math.hypot(ux,uz), mx = (c.x+o.x)/2, mz = (c.z+o.z)/2, e = .5/l;

}
function travelerPath(net, adj, r, steps){

  for(let i=0;i<loop.length;i++){ const c = net[loop[i]], p = net[loop[(i-1+loop.length)%loop.length]], n = net[loop[(i+1)%loop.length]];
    const ain = Math.atan2(p.z-c.z, p.x-c.x), aout = Math.atan2(n.z-c.z, n.x-c.x);
    pts.push([c.x+Math.cos(ain)*AP, (c.y+p.y)/2, c.z+Math.sin(ain)*AP]);

/* ---------- keep people out of buildings ---------- */
const _bx = new THREE.Box3(), _mi = new THREE.Matrix4();
function computeObstacles(grp){
  grp.updateMatrixWorld(true); const inv = grp.matrixWorld.clone().invert(), obs = [];
  (function walk(o){ for(const c of o.children){ if(c.userData.dyn) continue;
    if(c.isMesh){ if(!c.geometry.boundingBox) c.geometry.computeBoundingBox(); _bx.copy(c.geometry.boundingBox).applyMatrix4(_mi.multiplyMatrices(inv, c.matrixWorld));
      if(_bx.max.y > .14 && _bx.min.y < .3 && Math.max(_bx.max.x-_bx.min.x, _bx.max.z-_bx.min.z) > .12) obs.push([_bx.min.x, _bx.max.x, _bx.min.z, _bx.max.z]); }
    walk(c); } })(grp);
  grp.userData.obs = obs;
  for(const c of grp.children) if(c.userData.dyn && !c.userData.walker && c.userData.arms) pushOut(c.position, obs, .13*c.scale.x);
}
function pushOut(p, obs, rad){
  for(let it=0; it<4; it++){ let moved = false;
    for(const [x0,x1,z0,z1] of obs){ if(p.x > x0-rad && p.x < x1+rad && p.z > z0-rad && p.z < z1+rad){
      const dl = p.x-(x0-rad), dr = (x1+rad)-p.x, db = p.z-(z0-rad), df = (z1+rad)-p.z, m = Math.min(dl,dr,db,df);
      if(m === dl) p.x = x0-rad; else if(m === dr) p.x = x1+rad; else if(m === db) p.z = z0-rad; else p.z = z1+rad; moved = true; } }
    if(!moved) break; }
}

/* ---------- coastal ring roads + arched bridge, with traffic between islands ---------- */
const DECK = .1, ROADW = .72;
function polyPath(pts){ // pts: [x,y,z]; returns a => [x,z,y] by arc length, looping

  return a => { const d = (((a/(Math.PI*2)) % 1 + 1) % 1) * tot; let lo = 0, hi = L.length-1; while(hi - lo > 1){ const mid = (lo+hi) >> 1; if(L[mid] <= d) lo = mid; else hi = mid; }
    const k = (d - L[lo]) / ((L[hi] - L[lo]) || 1), p = pts[lo], q = pts[hi]; return [p[0]+(q[0]-p[0])*k, p[2]+(q[2]-p[2])*k, p[1]+(q[1]-p[1])*k]; };
}
function laneOffset(pts, off){ return pts.map((p,i) => { const a = pts[Math.max(0,i-1)], b = pts[Math.min(pts.length-1,i+1)]; let tx = b[0]-a[0], tz = b[2]-a[2]; const l = Math.hypot(tx,tz) || 1; tx /= l; tz /= l;
  return [p[0] - tz*off, p[1], p[2] + tx*off]; }); }
function buildRoads(){
  const [A, B] = islands, rA = A.R + .6, rB = B.R + .6, H = 1.5;

    const grp = new THREE.Group(); grp.position.set(isl.cx,0,0); scene.add(grp);
    const top = mesh(new THREE.RingGeometry(rr-ROADW/2, rr+ROADW/2, 160).rotateX(-Math.PI/2), 0x7d8593, 0,DECK,0); top.castShadow = false; grp.add(top);
    for(const r2 of [rr-ROADW/2, rr+ROADW/2]) grp.add(mesh(new THREE.CylinderGeometry(r2,r2,.24,160,1,true), mat(0xe2dccf,{side:THREE.DoubleSide}), 0,DECK-.12,0));
    for(const r2 of [rr-ROADW/2+.02, rr+ROADW/2-.02]) grp.add(mesh(new THREE.TorusGeometry(r2,.02,6,160).rotateX(Math.PI/2), 0xffffff, 0,DECK+.04,0));
    const n = Math.round(rr*Math.PI*2/.55); for(let i=0;i<n;i+=1){ if(i%2) continue; const a = i/n*Math.PI*2; const d = mesh(rbox(.04,.01,.2,.004), 0xffd36e, Math.cos(a)*rr, DECK+.006, Math.sin(a)*rr); d.rotation.y = -a; grp.add(d); }
    const m = Math.round(rr*Math.PI*2/3.2); for(let i=0;i<m;i++){ const a = (i+.5)/m*Math.PI*2, x = Math.cos(a)*(rr+ROADW/2+.08), z = Math.sin(a)*(rr+ROADW/2+.08);
      grp.add(mesh(cyl(.02,.03,.75,8), 0x5b6170, x,DECK+.37,z)); grp.add(mesh(sph(.07,10,8), lampMat, x,DECK+.78,z)); }
    // short side roads onto the land
    const cells = isl.cells;
    for(let k=0;k<6;k++){ const a = a0 + k*Math.PI/3, dx = Math.cos(a), dz = Math.sin(a); let land = 0;
      for(let t=0;t<rr;t+=.1){ const px = dx*t, pz = dz*t; if(cells.some(([cx,cz]) => Math.hypot(px-cx, pz-cz) < HEX*.92)) land = t; }
      const s0 = land - .25, s1 = rr - ROADW/2 + .05, len = s1 - s0; if(len < .25) continue;
      const sp = mesh(rbox(len, .1, .5, .03), 0x8a909a, dx*(s0+len/2), DECK+.0, dz*(s0+len/2)); sp.rotation.y = -a; sp.rotation.z = 0; grp.add(sp);
      for(const s of [-1,1]){ const rl = mesh(rbox(len, .06, .03, .01), 0xffffff, dx*(s0+len/2) - dz*s*.26, DECK+.08, dz*(s0+len/2) + dx*s*.26); rl.rotation.y = -a; grp.add(rl); } }

  const by = k => DECK + H*Math.sin(Math.PI*k);

    for(const s of [-1,1]){ const rl = mesh(rbox(len, .05, .04, .01), 0xf28b7d, (xa+xb)/2, (ya+yb)/2+.16, s*(ROADW/2+.05)); rl.rotation.z = ang; bridge.add(rl);
      if(i%2 === 0) bridge.add(mesh(cyl(.015,.015,.18,6), 0xffffff, xa, ya+.06, s*(ROADW/2+.05))); }
    if(i%2 === 0){ const dash = mesh(rbox(len*.6, .012, .04, .004), 0xffd36e, (xa+xb)/2, (ya+yb)/2+.035, 0); dash.rotation.z = ang; bridge.add(dash); } }
  const arch = mesh(new THREE.TorusGeometry((x1-x0)/2, .07, 8, 40, Math.PI), 0xf28b7d, (x0+x1)/2, DECK-.05, ROADW/2+.12); arch.scale.y = (H+.1)/((x1-x0)/2); bridge.add(arch);
  const arch2 = arch.clone(); arch2.position.z = -(ROADW/2+.12); bridge.add(arch2);
  for(const x of [x0+.3, x1-.3]) for(const s of [-1,1]){ bridge.add(mesh(cyl(.03,.04,.9,8), 0x5b6170, x, DECK+.45, s*(ROADW/2+.12))); bridge.add(mesh(sph(.08,10,8), lampMat, x, DECK+.92, s*(ROADW/2+.12))); }

  const span = (xa, xb) => { for(let i=1;i<N;i++){ const k = i/N; const kk = xa < xb ? k : 1-k; pts.push([xa+(xb-xa)*k, by(kk), 0]); } };
  ringPts(A, rA, 0, 1); span(x0, x1); ringPts(B, rB, Math.PI, -1); span(x1, x0); pts.push(pts[0]);
  const fwd = polyPath(laneOffset(pts, .17)), back = polyPath(laneOffset(pts.slice().reverse(), .17));
  const fleet = [

    o => vehicle(scene, Object.assign({col:0xffd23f, roofSign:0xffffff}, o)),
    o => vehicle(scene, Object.assign({col:0xf28b7d}, o)),
    o => vehicle(scene, Object.assign({col:0x8fc7ff, len:.7, h:.32, cab:.3, cabZ:.2}, o)),
    o => { const g = new THREE.Group(); g.userData.dyn = true; scooter(g, 0, 0, 0, pick([0xff9aa2,0x8fc7ff,0xffffff], Math.random)); const pr = person(g, 0, -.03, {s:.8, mood:'laugh'}); pr.position.y = .1; scene.add(g);
      movers.push({obj:g, path:o.path, speed:o.speed, t:o.t}); },
    o => vehicle(scene, Object.assign({col:0xffffff, stripe:0xff6b6b}, o)),

  const SP = .06;
  fleet.forEach((f, i) => { f({path:fwd, speed:SP, t:i/fleet.length*Math.PI*2}); f({path:back, speed:SP*1.05, t:(i+.5)/fleet.length*Math.PI*2}); });
}

let state = {mode:null, ci:null, ti:null, cat:null};
function highlight(pred){

    t.label.classList.toggle('on', on); t.label.classList.toggle('dim', !!pred && !on); }
  const lc = state.cat || (state.mode==='theme' ? DATA.candidates[state.ci].themes[state.ti].category : null);
  linkGroup.children.forEach(l => { l.visible = !lc || l.userData.cat===lc; l.material.opacity = .85; });
}
function selectTheme(ci, ti, fly=true){
  state = {mode:'theme', ci, ti, cat:null};
  const t = tiles.find(x=>x.ci===ci && x.ti===ti);
  highlight(x => x===t);
  if(fly) flyTo(new THREE.Vector3(t.world.x, 0, t.world.z), isPhone()?22:19, .82);
  renderThemeCard(ci, ti); markRows();
}
function selectCat(cat, fly=true){
  state = {mode:'cat', cat};

  if(fly && hits.length){ const c = new THREE.Vector3(); hits.forEach(h=>c.add(h.world)); c.divideScalar(hits.length); c.y=0;
    const both = new Set(hits.map(h=>h.ci)).size>1; if(both) isPhone() ? flyTo(new THREE.Vector3(0,0,0), 128*SPAN, .8, -Math.PI/2) : flyTo(new THREE.Vector3(0, 0, 1), 44*SPAN, .9);
    else flyTo(new THREE.Vector3(c.x, 0, c.z), isPhone()?26:24, .85); }
  renderCatCard(cat); markRows();
}

      + `<p class="note">點一個爭點，看雙方說法、成本試算、卡關點與可以追問的問題。</p>`;
  } else { const ci = tab==='chen'?0:1, c = DATA.candidates[ci], b = c.bio;
    tree.innerHTML = `<div class="bio"><b style="color:var(--${KEYS[ci]})">${esc(c.name)}</b>｜${esc(c.party)}<br>${esc(b.born)}<br>${esc(b.education)}<ul>${b.experience.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${(b.sources||[]).length ? `<div style="margin-top:4px;font-size:11px">資料來源：${b.sources.map(u => srcLink(u)).join('、')}</div>` : ''}
      ${c.slogans?.length? '<div style="margin-top:6px">'+c.slogans.map(x=>`<span class="slogan" style="background:var(--${KEYS[ci]}-soft);color:var(--${KEYS[ci]})">${esc(x)}</span>`).join('')+'</div>':''}</div>` +
      c.themes.map((th,ti)=>`<button class="row ${KEYS[ci]}" data-ci="${ci}" data-ti="${ti}"><span class="n">${String(ti+1).padStart(2,'0')}</span>
      <span class="t">${esc(th.name)}<small>${esc(th.category)}${isRecord(th)?'・已實施／施政紀錄':''}</small></span><span class="c">${th.items.length} ↗</span></button>`).join('')
      + (c.themes.some(th => th.items.some(it => it.chk)) ? `<p class="note">每項政見的「具體度」檢核，點主題後在卡片中查看。</p>` : ''); }
  markRows();
}
function markRows(){ document.querySelectorAll('#tree .row').forEach(r => r.classList.toggle('on',
  (state.mode==='cat' && r.dataset.cat===state.cat) || (state.mode==='theme' && +r.dataset.ci===state.ci && +r.dataset.ti===state.ti))); }
$('#tree').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; back = null;
  if(b.dataset.board){ openBoard('table'); return; } if(b.dataset.issueOpen != null){ openBoard('issue', +b.dataset.issueOpen); return; }
  if(b.dataset.cat) selectCat(b.dataset.cat); else selectTheme(+b.dataset.ci, +b.dataset.ti);
  if(isPhone()) $('#sidebar').classList.add('min'); });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', x===b)); $('#search').value=''; renderTree();
  if(tab!=='cmp') flyIsland(tab==='chen'?0:1); });
$('#search').addEventListener('input', renderTree);
$('#sheet-handle').onclick = () => $('#sidebar').classList.toggle('min');
document.querySelectorAll('[data-fly]').forEach(b => b.onclick = () => { b.dataset.fly==='all' ? overview() : flyIsland(+b.dataset.fly); });
/* camera pad */
function camState(){ const o = camera.position.clone().sub(controls.target), d = o.length(); return {d, polar:Math.acos(Math.min(1, o.y/d)), az:Math.atan2(o.x, o.z)}; }
function camTo(d, polar, az, tgt){ polar = Math.min(controls.maxPolarAngle, Math.max(controls.minPolarAngle, polar)); d = Math.min(controls.maxDistance, Math.max(controls.minDistance, d));
  flyTo((tgt || controls.target).clone(), d, polar, az, .55); }
const CAM = {
  zoomIn: s => camTo(s.d*.72, s.polar, s.az), zoomOut: s => camTo(s.d/.72, s.polar, s.az),
  rotL: s => camTo(s.d, s.polar, s.az - Math.PI/6), rotR: s => camTo(s.d, s.polar, s.az + Math.PI/6),
  tiltUp: s => camTo(s.d, s.polar - .22, s.az), tiltDown: s => camTo(s.d, s.polar + .22, s.az),
  home: () => overview(),
};
const VIEWS = {top:.14, mid:.9, low:1.25};
document.getElementById('campad').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; const s = camState();
  if(b.dataset.cam) CAM[b.dataset.cam](s);
  if(b.dataset.view){ camTo(b.dataset.view === 'low' ? Math.min(s.d, 40) : s.d, VIEWS[b.dataset.view], s.az); document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b)); } });
controls.addEventListener('start', () => { flight = null; hideHint(); });
$('#cp-toggle').onclick = e => { e.stopPropagation(); const o = $('#campad').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); e.currentTarget.textContent = o ? '收合 ⌃' : '視角 ⌄'; };
const hintEl = $('#hint'); hintEl.textContent = matchMedia('(pointer: coarse)').matches ? '單指拖曳移動地圖・雙指縮放與旋轉' : '按住拖曳移動地圖・滾輪縮放・右鍵拖曳旋轉';
function hideHint(){ hintEl.classList.add('off'); } setTimeout(hideHint, 7000);
addEventListener('keydown', e => { if(e.target.closest('input,textarea') || !$('#board').hidden) return; const s = camState();
  const k = {'+':'zoomIn','=':'zoomIn','-':'zoomOut','q':'rotL','e':'rotR','r':'tiltUp','f':'tiltDown'}[e.key]; if(k) CAM[k](s); });
let paused = reduce;
$('#t-pause').setAttribute('aria-pressed', paused);
$('#t-pause').onclick = e => { paused = !paused; e.currentTarget.setAttribute('aria-pressed', paused); };
$('#t-links').onclick = e => { linkGroup.visible = !linkGroup.visible; e.currentTarget.setAttribute('aria-pressed', linkGroup.visible); };

/* picking + hover */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null, hovered = null;
const tip = $('#tip');
function hitAt(e){ const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ptr, camera);
  return ray.intersectObjects([...tiles.flatMap(t => t.hits), ...specialHits], false)[0]?.object || null; }
function showTip(e, name){ if(!name){ tip.hidden = true; return; } tip.textContent = '苗栗特產・' + name; tip.hidden = false;
  const r = stage.getBoundingClientRect(); tip.style.transform = `translate(${e.clientX - r.left + 12}px, ${e.clientY - r.top - 34}px)`; }
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointermove', e => { if(e.pointerType !== 'mouse') return; const o = hitAt(e);
  hovered = o?.userData.tile || null; showTip(e, o?.userData.special); renderer.domElement.style.cursor = (hovered || o?.userData.special) ? 'pointer' : ''; });
renderer.domElement.addEventListener('pointerleave', () => { hovered = null; tip.hidden = true; });
let tipTimer;
renderer.domElement.addEventListener('pointerup', e => {
  if(!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  const o = hitAt(e); if(o?.userData.tile){ back = null; selectTheme(o.userData.tile.ci, o.userData.tile.ti); }
  else if(o?.userData.special){ showTip(e, o.userData.special); clearTimeout(tipTimer); tipTimer = setTimeout(() => tip.hidden = true, 2200); }
});

/* 24-hour clock: one Miaoli day every three minutes */
const now = new Date(); let tod = now.getHours() + now.getMinutes()/60, todJump = null;
const clockEl = $('#clock');
function setClock(){ const h = Math.floor(tod) % 24, m = Math.floor((tod % 1)*60); clockEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.querySelectorAll('[data-h]').forEach(b => { const d = ((tod - +b.dataset.h) % 24 + 24) % 24; b.setAttribute('aria-pressed', d < 3); }); }
document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { const to = +b.dataset.h; let d = ((to - tod) % 24 + 24) % 24; todJump = {from:tod, d, t:0}; });

function resize(){ const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

/* keep the scene centred in the part of the screen no panel covers */
const vOff = {x:0, y:0};
function updateViewOffset(dt){
  const W = stage.clientWidth, H = stage.clientHeight; let l = 0, r = W, t = 0, b = H;
  const sb = $('#sidebar').getBoundingClientRect(); if(sb.left > W/2) r = sb.left; else { b = Math.min(b, sb.top, $('.toolbar').getBoundingClientRect().top); t = $('.brand').getBoundingClientRect().bottom; }
  const cd = $('#card'); if(!cd.hidden){ const c = cd.getBoundingClientRect(); if(c.width > W*.55) b = Math.min(b, c.top); else l = Math.max(l, c.right); }
  const tx = (l + r)/2 - W/2, ty = (t + b)/2 - H/2, k = Math.min(1, dt*6);
  vOff.x += (tx - vOff.x)*k; vOff.y += (ty - vOff.y)*k;
  camera.setViewOffset(W, H, -vOff.x, -vOff.y, W, H);
}
/* ---------- loop ---------- */
const clock = new THREE.Clock(); let time = 0, clockTick = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if(todJump){ todJump.t = Math.min(1, todJump.t + dt/1.4); const k = 1 - Math.pow(1 - todJump.t, 3); tod = (todJump.from + todJump.d*k) % 24; if(todJump.t >= 1) todJump = null; }
  else if(!paused) tod = (tod + dt*24/180) % 24;
  applyTime(tod); if((clockTick += dt) > .25){ clockTick = 0; setClock(); }
  if(!paused){ time += dt;
    tickers.forEach(f => f(dt, time));
    movers.forEach(m => { m.t += dt*m.speed; const P = m.path(m.t), [x,z] = P, [x2,z2] = m.path(m.t + .02*Math.sign(m.speed||1));
      m.obj.position.x = x; m.obj.position.z = z; const obs = m.avoid && (m.obsAt ? m.obsAt(m.obj.position) : m.obj.parent?.userData.obs); if(obs) pushOut(m.obj.position, obs, m.avoid); if(!m.noRot && Math.hypot(x2-x, z2-z) < .5) m.obj.rotation.y = Math.atan2(x2-x, z2-z);
      m.obj.position.y = (P[2] ?? m.y ?? 0) + (m.liftAt ? m.liftAt(m.obj.position) : 0) + (m.hop ? Math.abs(Math.sin(time*m.hop + m.t))*.035 : 0) + (m.bob ? Math.sin(time*1.6 + m.t*3)*.05 : 0);
      if(m.bob) m.obj.rotation.z = Math.sin(time*1.3 + m.t)*.06;
      const arms = m.obj.userData.arms; if(arms){ const sw = Math.sin(time*9 + m.t*3)*.55; arms[0].rotation.x = sw; if(!arms[1].userData.hold) arms[1].rotation.x = -sw; } });
  }
  for(const t of tiles){
    const tgt = (t.target||0) + (t === hovered && !t.target ? .14 : 0);
    t.v += (tgt - t.lift) * 140 * dt; t.v *= Math.max(0, 1 - 9*dt); t.lift += t.v * dt;
    t.grp.position.y = .1 + t.lift;
    if(t.spark.visible = (t.target||0) > 0){ t.spark.rotation.y += dt*1.2; t.spark.position.y = t.props.position.y + 2.2 + Math.sin(time*2)*.1; }
  }
  if(paused) movers.forEach(m => { if(m.liftAt){ const P = m.path(m.t); m.obj.position.y = (P[2] ?? 0) + m.liftAt(m.obj.position); } });
  if(flight){ flight.t += dt/flight.dur; const k = flight.t>=1 ? 1 : 1-Math.pow(1-flight.t,3);
    camera.position.lerpVectors(flight.p0, flight.p1, k); controls.target.lerpVectors(flight.c0, flight.c1, k); if(flight.t>=1) flight=null; }
  updateViewOffset(dt); controls.update();
  { const lim = (islands[1].cx + islands[1].R + 4), tg = controls.target, nx = Math.max(-lim, Math.min(lim, tg.x)), nz = Math.max(-24, Math.min(24, tg.z)), dx = nx - tg.x, dz = nz - tg.z;
    if(dx || dz){ tg.x = nx; tg.z = nz; camera.position.x += dx; camera.position.z += dz; } tg.y = 0; } renderer.render(scene, camera); placeLabels();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
const plans = [planIsland(0), planIsland(1)];
buildIsland(0, plans[0], -(plans[0].R + 3.4)); buildIsland(1, plans[1], plans[1].R + 3.4); buildRoads();
const SPAN = (islands[1].cx - islands[0].cx)/26; buildLinks(); buildLabels();
islands.forEach((isl, ci) => { for(let i=0;i<8;i++) butterfly([0xffd36e,0xff9aa2,0xffffff,0x8fc7ff,0xffa94d][i%5], isl.cx, 0, isl.R*.55, 1.6+i%3*.4, i*1.7+ci); });
for(let i=0;i<4;i++) egret(i*1.6, 20 + i*3, 7 + i*.8);
const total = ci => DATA.candidates[ci].themes.reduce((s,t)=>s+t.items.length,0);
const newN = ci => DATA.candidates[ci].themes.reduce((s,t)=>s+t.items.filter(it=>!isRecItem(it)).length,0), recN = ci => total(ci) - newN(ci);
$('#side-sum').innerHTML = `陳品安 ${DATA.candidates[0].themes.length} 個主題・${newN(0)} 項政見<br>鍾東錦 ${DATA.candidates[1].themes.length} 個主題・${newN(1)} 項政見`;
$('#foot').textContent = DATA.footnote;
applyTime(tod); setClock(); resize();
camera.position.set(0, 70, 90); controls.target.set(0,0,0); overview();
renderTree(); frame();
requestAnimationFrame(()=>requestAnimationFrame(()=>$('#loading')?.classList.add('done')));
</script>
